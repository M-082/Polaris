---
layout: default
title: Matthew Casanovas
noindex: true
extra_css:
  - /styles/alerts.css
extra_js:
  - /scripts/alerts.js
---
<div class="retro-container">
    <aside class="calendar">
        <ul>
            <li id="clock"></li>
            <li id="date"></li>
        </ul>
    </aside>
    <aside class="play">
        <a href="{{ '/contact' | relative_url }}"><span class="icon-nudge">&#9654;</span> PLAY</a>
    </aside>

    <img id="secret-image" src="{{ '/assets/images/contact/Gtkm.png' | relative_url }}" alt="" class="secret-image">

    <form id="codeword-form" class="codeword-form">
        <!-- WHERE IS YOUR SENSE OF FUN? -->
        <div class="mb-3">
            <input type="text" class="form-control" id="codeword" name="codeword" autocomplete="off" required>
        </div>
        <button type="submit" class="btn btn-retro">PLAY &gt;</button>
        <p id="codeword-status" class="mt-3 mb-0"></p>
    </form>

    <p id="unlocked-message"><span id="unlocked-text"></span><span class="blink-cursor">_</span></p>
</div>
