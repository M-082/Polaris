<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% if page.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
    <title>{{ page.title | default: site.title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ '/styles/styles.css' | relative_url }}">
    {% for css in page.extra_css %}
    <link rel="stylesheet" href="{{ css | relative_url }}">
    {% endfor %}
</head>
<body>
    <div id="navbar">{% include navbar.html %}</div>

    {{ content }}

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% for js in page.extra_js %}
    <script src="{{ js | relative_url }}"></script>
    {% endfor %}
</body>
</html>
